<script>
// URL de tu Google Apps Script
const API_URL = "https://script.google.com/macros/s/AKfycbzyP-NVxTcMoPP2PiSRa1ekfoZ7Pg6DsDSRG0ghJ8I4QhfEHbQ2fBjUTLdPGaZjcbdV/exec";

const DEFAULT_AREAS=[
["Producción",["Producción", "Merma"]],
["Calidad",["Producto detenido","% Rechazo necker","% Rechazo orion"]],
["Área química",["Movilidad","Tramp Oil","Aceites totales"]],
["Front end",["Peso de copa","% Rompimientos","Consumo aceite","Tiempos muertos"]],
["Impresoras",["Viscosidad","Peso de barniz ext","Peso de barniz uv","Tiempos muertos"]],
["Back end",["Consumo barniz","Tiempos muertos Necker","Merma"]],
["Transportes",["Atorones en cascadas","Merma bote caído"]]];

// Configuración de áreas compartida entre todos los usuarios (se guarda en el servidor).
// Cada área e indicador tiene un id estable; los datos se guardan con esos ids
// para que lo que captura una persona nunca aparezca en otra área.
const AREAS_URL = "/api/areas";
const seedCfg = () => DEFAULT_AREAS.map(([name, inds], ai) => ({ id: "a" + ai, name, inds: inds.map((n, i) => ({ id: "i" + i, name: n })) }));
let CFG = seedCfg();
try { const c = JSON.parse(localStorage.getItem("config_areas_v2")); if (Array.isArray(c) && c.length) CFG = c; } catch(e) {}
// Vista compatible [nombre, [indicadores]] usada por el resto de la app
let AREAS = [];
// Back end: "Peso de cera" pasa a ser "Merma" y se coloca en 3ª posición (debajo de Tiempos muertos)
function migrateCfg(c) {
  const n = x => String(x || "").trim().toLowerCase();
  return c.map(a => {
    if (n(a.name) !== "back end" || !Array.isArray(a.inds)) return a;
    const inds = a.inds.map(i => n(i.name) === "peso de cera" ? { ...i, name: "Merma" } : i);
    const mi = inds.findIndex(i => n(i.name) === "merma");
    if (mi < 0) return { ...a, inds };
    const [m] = inds.splice(mi, 1);
    const ti = inds.findIndex(i => n(i.name).startsWith("tiempos muertos"));
    inds.splice(ti >= 0 ? ti + 1 : inds.length, 0, m);
    return { ...a, inds };
  });
}
function setCfg(c) {
  if (!Array.isArray(c) || !c.length) return;
  c = migrateCfg(c);
  CFG = c;
  AREAS = CFG.map(a => [a.name, a.inds.map(i => i.name)]);
  localStorage.setItem("config_areas_v2", JSON.stringify(CFG));
}
setCfg(CFG);
const aid = ai => CFG[ai] ? CFG[ai].id : "a" + ai;
const iid = (ai, i) => CFG[ai] && CFG[ai].inds[i] ? CFG[ai].inds[i].id : "i" + i;

async function areasOp(body) {
  const res = await fetch(AREAS_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => null);
  if (!res.ok || !Array.isArray(data)) throw new Error((data && data.error) || "Error al guardar la configuración");
  setCfg(data);
  return data;
}

async function loadAreas() {
  try {
    const res = await fetch(AREAS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("config");
    setCfg(await res.json());
    // Migra áreas/indicadores que se crearon solo en este navegador con la versión anterior
    const old = localStorage.getItem("config_areas");
    if (old) {
      try { const list = JSON.parse(old); if (Array.isArray(list)) await areasOp({ op: "merge", areas: list }); } catch(e) {}
      localStorage.removeItem("config_areas");
    }
    return true;
  } catch(e) { return false; }
}

const LN=["Línea 1","Línea 2","Línea 2.1"],COL=["var(--s1)","var(--s2)","var(--s3)"];
const $=id=>document.getElementById(id);
const escH=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let docs={};
// Pendientes: { id: {tipo:"pendiente", id, fecha, areaId, area, resp, obs, done, doneDate} }
let PEND={};
try{PEND=JSON.parse(localStorage.getItem("pend_v1"))||{}}catch(e){PEND={}}
const key=(f,a)=>f+"_"+aid(a);
// Orden de visualización en Seguimiento: Producción primero (sin alterar índices guardados)
const isProd=a=>{const n=norm(a[0]);return n==="producción"||n==="produccion"};
const segAreas=()=>{const o=AREAS.map((a,ai)=>[a,ai]);return o.filter(([a])=>isProd(a)).concat(o.filter(([a])=>!isProd(a)))};
const com=(f,a,i)=>{const d=docs[key(f,a)];return (d&&d.cm&&d.cm[iid(a,i)])||""};
const val=(f,a,i,l)=>{const d=docs[key(f,a)];const r=d&&d.v&&d.v[iid(a,i)];return r&&r[l]!=null?r[l]:null};

// Formato numérico con comas para separación de millares
const fmt=v=>{
  if(v==null) return "—";
  // Hasta 6 decimales para no ocultar valores pequeños (ej. 0.002)
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 6 });
};

// Promedios con 2 decimales, excepto "Peso de barniz uv" que conserva todos sus decimales
const fmtAvg=(v,n)=>{
  if(v==null) return "—";
  if(isTM(n)) return hm(v);
  if(norm(n)==="peso de barniz uv") return fmt(v);
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
};

// ===== Tiempos muertos: captura y visualización en horas:minutos (se guardan como horas decimales) =====
const isTM = n => norm(n).includes("tiempos muertos");
// Horas decimales -> "H:MM"
const hm = h => {
  if (h == null || isNaN(h)) return "—";
  const t = Math.round(Math.abs(h) * 60);
  return (h < 0 ? "-" : "") + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
};
// "2:55" -> 2.9166..., "2" o "2.5" -> horas decimales, "" -> null, inválido -> NaN
const parseHM = str => {
  const x = String(str == null ? "" : str).trim();
  if (x === "") return null;
  let m = x.match(/^(\d+):(\d{1,2})$/);
  if (m) return +m[2] < 60 ? +m[1] + +m[2] / 60 : NaN;
  m = x.match(/^\d+(?:[.,]\d+)?$/);
  return m ? +x.replace(",", ".") : NaN;
};
// Merma de Producción: total del día = (Línea 1 + Línea 2) / 2 (solo si hay ambas)
const isProdMerma = (n, ai) => norm(n) === "merma" && ["producción", "produccion"].includes(norm(AREAS[ai][0]));
const mermaTot = (f, ai, ii) => {
  const a = val(f, ai, ii, 0), b = val(f, ai, ii, 1);
  return a != null && b != null ? (a + b) / 2 : null;
};

// Valor según el tipo de indicador (tiempos muertos en h:mm)
const fv = (n, v) => isTM(n) ? hm(v) : fmt(v);

// Indicadores que solo se capturan en Línea 1 y Línea 2 (sin Línea 2.1)
const SOLO_L12=["producto detenido","% rechazo necker","movilidad","peso de copa","% rompimientos","consumo aceite","tiempos muertos","consumo barniz","tiempos muertos necker","merma","merma bote caído","producción y merma","produccion y merma","producción","produccion"];
// Indicadores con un solo recuadro de captura (Línea 1)
const SOLO_L1=["tramp oil","aceites totales"];
const esc=x=>String(x??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const norm=x=>String(x||"").trim().toLowerCase();
const lineas=(n,ai)=>{
  n=norm(n);
  const areaNombre = AREAS[ai] ? norm(AREAS[ai][0]) : "";
  // Si el área es Producción, solo habilita Línea 1 y Línea 2
  if(areaNombre === "producción" || areaNombre === "produccion") return [0,1];
  if(SOLO_L1.includes(n)) return [0];
  // En Impresoras, "Tiempos muertos" sí lleva Línea 2.1
  if(n=="tiempos muertos"&&areaNombre=="impresoras") return [0,1,2];
  return SOLO_L12.includes(n)?[0,1]:[0,1,2];
};
// Indicadores que muestran el acumulado del mes en la gráfica de tendencia
const ACUM=["producción","produccion","producto detenido","consumo aceite","consumo de aceite","merma bote caído","merma bote caido","merma de bote caído","merma de bote caido"];
// Indicadores que se grafican como barras verticales apiladas (Línea 1 + Línea 2)
const STACK=["producción","produccion","producto detenido","consumo aceite","consumo de aceite","merma bote caído","merma bote caido","merma de bote caído","merma de bote caido"];
const NA=`<td class="n mu" title="No aplica">·</td>`;

// Función de evaluación de alerta (Semáforo)
function getAlertClass(indicatorName, value, ai) {
  if (value == null) return "";
  const name = norm(indicatorName);
  const area = AREAS[ai] ? norm(AREAS[ai][0]) : "";
  // Tiempos muertos: Front end > 2, Impresoras y Necker > 1
  if (name.includes("tiempos muertos")) {
    const lim = name.includes("necker") || area === "impresoras" ? 1 : area === "front end" ? 2 : null;
    if (lim != null && value > lim) return "alert-red";
    return "";
  }
  if (name === "movilidad") return value > 21 ? "alert-red" : "";
  if (name.includes("% rechazo necker") || name.includes("% rechazo orion")) {
    if (value >= 0.8) return "alert-red";
    if (value >= 0.5 && value <= 0.7) return "alert-yellow";
    if (value < 0.5) return "alert-green";
  }
  return "";
}

function postDoc(k, data){

}

function renderPend() {
  // Solo los pendientes del día (vista diaria) o del mes (vista mensual) seleccionado
  const mensual = $("vm").value === "m";
  const periodo = mensual ? $("vmo").value : $("vd").value;
  const list = Object.values(PEND).filter(d => periodo && d.fecha && (mensual ? d.fecha.slice(0, 7) === periodo : d.fecha === periodo));
  const open = list.filter(d => !d.done).length;
  $("pcnt").textContent = `· ${open} pendiente${open === 1 ? "" : "s"} · ${list.length - open} realizado${list.length - open === 1 ? "" : "s"}`;
  const fa = $("pfa").value, fe = $("pfe").value;

  // Gauge de avance: realizados / total del periodo (respeta el filtro de área)
  const gl = list.filter(d => fa === "all" || d.areaId === fa);
  const gt = gl.length, gd = gl.filter(d => d.done).length;
  const pct = gt ? Math.round(gd / gt * 100) : 0;
  const gc = !gt ? "var(--br)" : pct >= 80 ? "var(--ok)" : pct >= 40 ? "var(--pend)" : "#c0392b";
  $("pgauge").innerHTML = `<svg viewBox="0 0 140 84" width="150" role="img" aria-label="Avance de pendientes ${pct}%">
    <path d="M14 70 A56 56 0 0 1 126 70" fill="none" stroke="var(--br)" stroke-width="12" pathLength="100"/>
    ${gt && pct ? `<path d="M14 70 A56 56 0 0 1 126 70" fill="none" stroke="${gc}" stroke-width="12" pathLength="100" stroke-dasharray="${pct} 100"/>` : ""}
    <text x="70" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${gt ? pct + "%" : "—"}</text>
    <text x="70" y="78" text-anchor="middle" font-size="10" fill="var(--mu)">${gt ? `${gd} de ${gt} realizados` : "Sin pendientes"}</text>
  </svg>`;

  const rows = list
    .filter(d => (fa === "all" || d.areaId === fa) && (fe === "t" || (fe === "p" ? !d.done : d.done)))
    .sort((x, y) => (x.done - y.done) || (x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : 0))
    .map(d => `<tr class="${d.done ? "pdone" : ""}">
      <td class="pc"><input type="checkbox" ${d.done ? "checked" : ""} onchange="togglePend('${d.id}', this.checked)" title="Marcar como realizado"></td>
      <td>${escH(d.area)}</td>
      <td>${escH(d.resp)}</td>
      <td class="pob"><span class="pot">${escH(d.obs)}</span>${(d.coms || []).map(c => `<div class="pcom">💬 ${escH(c.t)} <span class="mu">· ${pfmt(c.f)}</span></div>`).join("")}</td>
      <td>${pfmt(d.fecha)}</td>
      <td>${d.done ? `<span class="badge ok">✓ ${pfmt(d.doneDate)}</span>` : `<span class="badge pend">Pendiente</span>`}</td>
      <td class="n" style="white-space:nowrap"><button class="btn-sm" onclick="commentPend('${d.id}')" title="Agregar comentario">💬</button> <button class="btn-sm" onclick="deletePend('${d.id}')" title="Borrar pendiente">🗑</button></td>
    </tr>`).join("");
  $("pl").innerHTML = rows
    ? `<table><thead><tr><th class="pc">✓</th><th>Área</th><th>Responsable</th><th>Observaciones</th><th>Fecha</th><th>Estado</th><th class="n"></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<p class="mu">No hay pendientes ${mensual ? "en este mes" : "en este día"}.</p>`;
}

$("sv").onclick=async()=>{
  const f=$("cf").value,a=+$("ca").value;
  if(!f){$("ms").textContent="Elige una fecha";return}
  // Validar formato h:mm de tiempos muertos antes de guardar
  for (let i = 0; i < AREAS[a][1].length; i++) {
    if (!isTM(AREAS[a][1][i])) continue;
    for (const l of [0,1,2]) {
      const el = $("in_"+i+"_"+l);
      if (el && isNaN(parseHM(el.value))) { el.focus(); $("ms").textContent = `⚠ Formato inválido en "${AREAS[a][1][i]}" (${LN[l]}). Usa horas:minutos, ej. 2:55`; return; }
    }
  }
  $("ms").textContent="Guardando...";
  const k=key(f,a);
  // Trae lo último de la nube para no borrar lo que otra persona capturó mientras tanto
  await loadCloudData();
  const base = docs[k] && docs[k].v ? docs[k].v : {};
  const v = {};
  Object.keys(base).forEach(id => v[id] = [...base[id]]);
  AREAS[a][1].forEach((n,i)=>{
    const id = iid(a,i), orig = capOrig.k === k ? (capOrig.v[id] || []) : [];
    const row = v[id] ? [...v[id]] : [null,null,null];
    [0,1,2].forEach(l=>{
      const el=$("in_"+i+"_"+l); if(!el) return;
      const tm = isTM(n);
      const x = tm ? parseHM(el.value) : (el.value===""?null:+el.value);
      // En tiempos muertos se compara el texto mostrado (h:mm) para no alterar valores sin cambios
      const same = tm ? el.value.trim() === (orig[l] == null ? "" : hm(orig[l])) : x === (orig[l] ?? null);
      if (capOrig.k !== k || !same) row[l] = x;
    });
    v[id] = row;
  });
  // Comentarios por indicador: igual que las celdas, solo se reemplaza el que esta persona cambió
  const cm = {...((docs[k] && docs[k].cm) || {})};
  AREAS[a][1].forEach((n,i)=>{
    const id = iid(a,i), el = $("cm_"+i); if(!el) return;
    const x = el.value.trim();
    if (capOrig.k !== k || x !== (capOrig.cm[id] || "")) { if (x) cm[id] = x; else delete cm[id]; }
  });
  const data={fecha:f,area:AREAS[a][0],v,cm};
  if (docs[k] && docs[k].c) data.c = docs[k].c;

  try{
    docs[k]=data;
    localStorage.setItem("reg_v1",JSON.stringify(docs));
    await postDoc(k, data);
    $("ms").textContent="✓ Guardado exitosamente · "+AREAS[a][0]+" · "+f;
    const msg = $("ms").textContent;
    renderCap(); $("ms").textContent = msg;
    render();
  }catch(e){
    $("ms").textContent="⚠ Error al guardar los datos";
    render();
  }
};

let lastSel=null;
function drawChart(){
  const s=$("ci");if(!s)return;
  if(s.dataset.init!="1"){if(lastSel)s.value=lastSel;if(!s.value&&s.options.length)s.selectedIndex=0;s.dataset.init="1"}
  lastSel=s.value;
  const [ai,ii]=s.value.split(".").map(Number),days=monthDays();
  const W=640,H=240,P=36;
  const F=isTM(AREAS[ai][1][ii])?hm:fmt;
  const pm=isProdMerma(AREAS[ai][1][ii],ai);
  const mt=days.map(d=>pm?mermaTot(d,ai,ii):null);
  const ls=lineas(AREAS[ai][1][ii],ai);
  const acum=ACUM.includes(norm(AREAS[ai][1][ii]));
  const stack=STACK.includes(norm(AREAS[ai][1][ii]));
  const series=[0,1,2].map(l=>ls.includes(l)?days.map(d=>val(d,ai,ii,l)):days.map(()=>null));
  const all=series.flat().filter(x=>x!=null);
  
  if(!all.length){
    $("ch").innerHTML='<p class="mu">Sin datos para este indicador en el mes.</p>';
    if($("ch-leg")) $("ch-leg").innerHTML = "";
    return;
  }
  
  // Total por día (suma de las líneas) para las barras apiladas
  const tot=days.map((_,i)=>{const vs=ls.map(l=>series[l][i]).filter(x=>x!=null);return vs.length?vs.reduce((a,b)=>a+b,0):null});
  let mn,mx;
  if(stack){mn=0;mx=Math.max(0,...tot.filter(x=>x!=null));if(mx===0)mx=1;mx*=1.1}
  else{mn=Math.min(...all);mx=Math.max(...all);if(mn===mx){mn-=1;mx+=1}
    const pad=(mx-mn)*.1;mn-=pad;mx+=pad;}
  const bw=(W-P-10)/Math.max(days.length,1);
  const step=stack?bw:(W-P-10)/Math.max(days.length-1,1);
  const X=i=>stack?P+(i+.5)*bw:P+i*step,Y=v=>H-24-(v-mn)*(H-40)/(mx-mn);
  let g="";
  
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${P}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--br)"/><text x="${P-4}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mu)">${F(v)}</text>`}
  days.forEach((d,i)=>{if((i+1)%5==0||i==0)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mu)">${i+1}</text>`});
  
  let legHtml = "";
  
  series.forEach((sr,l)=>{
    if(!ls.includes(l)) return;
    const valid = sr.filter(x=>x!=null);
    const avg = valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : null;
    
    legHtml += `<span style="margin-right:12px"><i style="background:${COL[l]}"></i>${LN[l]} ${avg!=null ? `<span style="color:${COL[l]}; font-weight:600; margin-left:4px">(${acum?`Acumulado: ${F(valid.reduce((a,b)=>a+b,0))} · `:""}Prom: ${fmtAvg(avg,AREAS[ai][1][ii])})</span>`:''}</span>`;
    
    if(stack) return;
    if(avg != null) {
      const y = Y(avg);
      g += `<line x1="${P}" x2="${W-10}" y1="${y}" y2="${y}" stroke="${COL[l]}" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>`;
    }
    
    let p="";sr.forEach((v,i)=>{if(v!=null)p+=(p&&sr[i-1]!=null?"L":"M")+X(i)+" "+Y(v)});
    if(p) g+=`<path d="${p}" fill="none" stroke="${COL[l]}" stroke-width="2"/>`;
    sr.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${COL[l]}"/>`});
  });
  
  if(stack){
    // Barras verticales apiladas: Línea 1 abajo, Línea 2 encima
    days.forEach((d,i)=>{
      let base=0;
      ls.forEach(l=>{
        const v=series[l][i];if(v==null||v<=0)return;
        const y0=Y(base),y1=Y(base+v);
        g+=`<rect x="${X(i)-bw*.35}" y="${y1}" width="${bw*.7}" height="${Math.max(0,y0-y1)}" fill="${COL[l]}"/>`;
        base+=v;
      });
    });
    const tv=tot.filter(x=>x!=null);
    if(tv.length) legHtml += `<span style="font-weight:600">Total: <span style="margin-left:4px">${F(tv.reduce((a,b)=>a+b,0))} · Prom: ${fmtAvg(tv.reduce((a,b)=>a+b,0)/tv.length,AREAS[ai][1][ii])}</span></span>`;
  }else if(acum&&ls.length>1){
    // Indicadores acumulables sin barras (p. ej. Producto detenido): total de todas las líneas
    const tv=tot.filter(x=>x!=null);
    if(tv.length) legHtml += `<span style="font-weight:600">Total: <span style="margin-left:4px">${F(tv.reduce((a,b)=>a+b,0))} · Prom: ${fmtAvg(tv.reduce((a,b)=>a+b,0)/tv.length,AREAS[ai][1][ii])}</span></span>`;
  }
  if(pm){
    const mv=mt.filter(x=>x!=null);
    if(mv.length) legHtml += `<span style="font-weight:600">Total: <span style="margin-left:4px">Prom: ${fmtAvg(mv.reduce((a,b)=>a+b,0)/mv.length,AREAS[ai][1][ii])}</span></span>`;
  }
  // Resalta el día seleccionado
  const si=selDay?days.indexOf(selDay):-1;
  if(si>=0){const sw=stack?bw:Math.max(step,6);g=`<rect x="${X(si)-sw/2}" y="16" width="${sw}" height="${H-40}" fill="var(--mu)" opacity="0.18"/>`+g}
  if($("ch-leg")) $("ch-leg").innerHTML = legHtml;
  g+=`<line id="ch-hl" x1="0" x2="0" y1="16" y2="${H-24}" stroke="var(--mu)" stroke-width="1" stroke-dasharray="3,3" visibility="hidden"/>`;
  g+=`<g id="ch-hd" visibility="hidden">${[0,1,2].map(l=>`<circle r="5" fill="var(--card)" stroke="${COL[l]}" stroke-width="2"/>`).join("")}</g>`;
  $("ch").innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="ttip" id="ch-tt"></div>`;

  const svg=$("ch").querySelector("svg"),hl=$("ch-hl"),hd=$("ch-hd"),tt=$("ch-tt");
  const hide=()=>{hl.setAttribute("visibility","hidden");hd.setAttribute("visibility","hidden");tt.style.display="none"};
  const idx=e=>{
    const r=svg.getBoundingClientRect();if(!r.width)return -1;
    const sx=(e.clientX-r.left)*W/r.width;
    return Math.max(0,Math.min(days.length-1,stack?Math.floor((sx-P)/step):Math.round((sx-P)/step)));
  };
  const move=e=>{
    const r=svg.getBoundingClientRect();if(!r.width)return;
    const i=idx(e);
    const x=X(i);
    hl.setAttribute("x1",x);hl.setAttribute("x2",x);hl.setAttribute("visibility","visible");
    let any=false;
    [...hd.children].forEach((c,l)=>{const v=series[l][i];if(v!=null)any=true;if(stack){c.style.display="none";return}if(v!=null){any=true;c.setAttribute("cx",x);c.setAttribute("cy",Y(v));c.style.display=""}else c.style.display="none"});
    hd.setAttribute("visibility","visible");
    tt.innerHTML=`<b>${dfmt(days[i])}</b>`+ls.map(l=>`<div><i style="background:${COL[l]}"></i>${LN[l]}<span class="v">${F(series[l][i])}</span></div>`+(acum&&!stack?`<div class="mu" style="padding-left:14px">Acumulado al día<span class="v">${F(series[l].slice(0,i+1).reduce((a,b)=>a+(b??0),0))}</span></div>`:"")).join("")+((stack||(acum&&ls.length>1))&&any?`<div style="border-top:1px solid var(--br);margin-top:3px;padding-top:3px;font-weight:600">Total<span class="v">${F(tot[i])}</span></div><div class="mu" style="padding-left:14px">Acumulado total al día<span class="v">${F(tot.slice(0,i+1).reduce((a,b)=>a+(b??0),0))}</span></div>`:"")+(pm&&mt[i]!=null?`<div style="border-top:1px solid var(--br);margin-top:3px;padding-top:3px;font-weight:600">Total<span class="v">${F(mt[i])}</span></div>`:"")+(any?"":`<div class="mu">Sin captura</div>`);
    tt.style.display="block";
    const cw=$("ch").clientWidth,px=x*r.width/W,tw=tt.offsetWidth;
    let left=px+12;if(left+tw>cw)left=px-tw-12;if(left<0)left=0;
    tt.style.left=left+"px";
    tt.style.top=Math.max(0,(e.clientY-r.top)-tt.offsetHeight-10)+"px";
  };
  svg.addEventListener("pointermove",move);
  svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",hide);
  // Clic en un día: la tabla muestra solo los datos de ese día (clic de nuevo para quitar)
  svg.style.cursor="pointer";
  svg.addEventListener("click",e=>{const i=idx(e);if(i<0)return;setSelDay(selDay===days[i]?null:days[i])});
}

// Normaliza los datos de la nube: cada registro se ubica según el nombre de área
// que trae guardado (no según el índice), y se ignoran los registros borrados.
function normalizeDocs(raw, pendOut){
  const out = {}, moved = [];
  const byName = {};
  CFG.forEach(a => byName[norm(a.name)] = a.id);
  Object.keys(raw || {}).forEach(k => {
    const d = raw[k];
    if (d && typeof d === "object" && d.tipo === "pendiente") { if (pendOut && !d.deleted && d.id) pendOut[d.id] = d; return; }
    if (!d || typeof d !== "object" || d.deleted) return;
    const f = d.fecha || k.split("_")[0];
    const id = byName[norm(d.area)];
    const nk = id ? f + "_" + id : k;
    if (nk === k) out[k] = d; else moved.push([nk, d]);
  });
  // Los registros que quedaron en una clave equivocada solo se usan si no hay uno correcto
  moved.forEach(([nk, d]) => { if (!out[nk]) out[nk] = d; });
  return out;
}

async function loadCloudData(){
  try{
    if(API_URL){
      const res = await fetch(API_URL, { redirect: "follow", cache: "no-store" });
      if(!res.ok) throw new Error("Error en la respuesta del servidor");
      const po = {};
      docs = normalizeDocs(await res.json(), po);
      PEND = po; savePend();
      localStorage.setItem("reg_v1", JSON.stringify(docs));
      $("warn").innerHTML='<div class="warn" style="border-color:var(--ok);color:var(--ok)">✓ Conectado a la base de datos en Google Sheets</div>';
      return true;
    }
  }catch(e){
    console.error("Error al conectar:", e);
    $("warn").innerHTML='<div class="warn">⚠ Modo sin conexión / Sincronizando localmente</div>';
  }
  return false;
}

// Recarga configuración y datos; no pisa lo que el usuario está escribiendo
let refreshing = false;
async function refreshAll(force){
  if (refreshing) return;
  refreshing = true;
  try {
    await loadAreas();
    await loadCloudData();
    updateAreaSelect();
    if (force || !capDirty) renderCap();
    render();
  } finally { refreshing = false; }
}

(async()=>{
  try{docs=normalizeDocs(JSON.parse(localStorage.getItem("reg_v1")||"{}"))}catch(e){}
  renderCap();
  await refreshAll(true);
  // Sincronización automática con los cambios de otras personas
  setInterval(()=>{ if(!document.hidden) refreshAll(false); }, 30000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refreshAll(false); });
})();
